name: on_chain_oracle_ai
description: "On-Chain Oracle AI"
publish_to: 'none'
version: 1.0.5+11

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1
  http: ^1.4.0
  web_socket_channel: ^3.0.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  # Profile photo — Edit Profile / Account avatar
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  fl_chart: ^1.2.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: assets/images/app_icon.png
  adaptive_icon_foreground_inset: 18
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png
    - assets/images/app_logo.png
