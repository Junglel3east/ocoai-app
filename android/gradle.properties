# Gradle JVM — conservative settings to avoid daemon crashes on Windows
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2

android.useAndroidX=true

# Required for Flutter 3.44 + AGP 9 until all plugins migrate to Built-in Kotlin.
# See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.newDsl=false
android.builtInKotlin=false
